version: v1.0
name: Continuous Integration Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004

blocks:
  - name: Code signing
    task:
      secrets:
        - name: gpg-keys
      jobs:
        - name: sign
          commands:
            - gpg --import /root/public.key
            - gpg --import /root/private.key
            - gpg --output 1-signing/artifact.txt.sig --detach-sign 1-signing/artifact.txt
            - gpg --verify 1-signing/artifact.txt.sig 1-signing/artifact.txt
            - artifact push workflow 1-signing/artifact.txt.sig

  - name: SBOM
    task:
      prologue:
        commands:
          - cd 2-sbom
          - python -m venv venv
          - source venv/bin/activate
      jobs:
        - name: Cyclonedx
          commands:
            - pip install cyclonedx-bom
            - cyclonedx-py requirements -o bom.json
            - artifact push workflow 2-sbom/bom.json

  - name: Audit dependencies
    task:
      prologue:
        commands:
          - cd 3-dependency-scanning
          - python -m venv venv
          - source venv/bin/activate
      jobs:
        - name: pip audit
          commands:
            - pip install pip-audit
            - pip-audit -r requirements.txt || true

  - name: SAST Scan
    task:
      prologue:
        commands:
          - cd 4-sast
          - python -m venv venv
          - source venv/bin/activate
      jobs:
        - name: Bandit
          commands:
            - pip install bandit
            - bandit -r vulnerable_script.py || true

  - name: DAST Scan
    task:
      prologue:
        commands:
          - cd 5-dast
          - python -m venv venv
          - source venv/bin/activate
          - pip install -r requirements.txt
          - pip install wapiti3
      jobs:
        - name: wapiti
          commands:
            - gunicorn -b 0.0.0.0:4000 app:app --daemon
            - sleep 2
            - wapiti -u http://localhost:4000 -f html
            - artifact push workflow /root/.wapiti/generated_report
