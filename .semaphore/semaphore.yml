version: v1.0
name: Continuous Integration Pipeline
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: 'registry.semaphoreci.com/python:3.12.1'
blocks:
  - name: Code signing
    task:
      jobs:
        - name: sign
          commands:
            - checkout
            - gpg --import 1-signing/public.key
            - gpg --import 1-signing/private.key
            - gpg --output 1-signing/artifact.txt.sig --detach-sign 1-signing/artifact.txt
            - gpg --verify 1-signing/artifact.txt.sig 1-signing/artifact.txt
            - artifact push workflow 1-signing/artifact.txt.sig
  - name: SBOM
    task:
      jobs:
        - name: Cyclonedx
          commands:
            - checkout
            - cd 2-sbom
            - pip install cyclonedx-bom
            - cyclonedx-py requirements -o bom.json
            - artifact push workflow 2-sbom/bom.json
  - name: Audit dependencies
    task:
      jobs:
        - name: pip audit
          commands:
            - checkout
            - cd 3-dependency-scanning
            - pip install pip-audit
            - pip-audit -r requirements.txt || true
  - name: SAST Scan
    task:
      jobs:
        - name: Bandit
          commands:
            - checkout
            - cd 4-sast
            - pip install bandit
            - bandit -r vulnerable_script.py || true
  - name: DAST Scan
    task:
      jobs:
        - name: wapiti
          commands:
            - checkout
            - cd 5-dast
            - pip install -r requirements.txt
            - pip install wapiti3
            - 'gunicorn -b 0.0.0.0:4000 app:app --daemon'
            - sleep 2
            - 'wapiti -u http://localhost:4000 -f html'
            - artifact push workflow /home/semaphore/.wapiti/generated_report
